<!DOCTYPE html>
<html>

<head>
  <base target="_top">

  <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>        
	
	
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      padding: 10px;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      color: #222;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }


    /* =====================================================
       PAGE
    ===================================================== */

    .page {
      width: 100%;
      max-width: 1200px;
      margin: auto;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header {
      margin-bottom: 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 21px;
    }

    .header p {
      margin: 4px 0 0;
      color: #777;
      font-size: 12px;
    }


    /* =====================================================
       TOOLBAR
    ===================================================== */

    .toolbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .toolbar button {
      min-height: 38px;
      padding: 7px 12px;

      border: 1px solid #ccc;
      border-radius: 8px;

      background: white;
      color: #222;

      font-size: 13px;
      cursor: pointer;
    }

    .toolbar button.active {
      background: #222;
      color: white;
      border-color: #222;
    }


    /* =====================================================
       KHUNG SƠ ĐỒ
    ===================================================== */

    .map-wrapper {
      width: 100%;

      background: white;

      border-radius: 14px;

      padding: 16px;

      box-shadow:
        0 2px 9px rgba(0,0,0,.08);

      overflow-x: auto;
    }


    /*
       Đây là thay đổi quan trọng.

       Không còn absolute.

       Factory map tự cao theo nội dung.
    */

    .factory-map {
      width: 100%;
      min-width: 760px;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        190px;

      grid-template-areas:

        "layout3 empty"

        "layout3 layout2"

        "layout1 layout2";

      column-gap: 70px;
      row-gap: 65px;

      align-items: start;

      padding:
        15px
        20px
        25px;
    }


    /* =====================================================
       LAYOUT BLOCK
    ===================================================== */

    .layout-block {
      min-width: 0;
    }


    /*
       Layout 3
       phía trên bên trái
    */

    .layout3 {
      grid-area: layout3;

      width: 500px;

      justify-self: start;
    }


    /*
       Layout 2
       phía bên phải
    */

    .layout2 {
      grid-area: layout2;

      width: 190px;

      justify-self: end;

      align-self: end;

      margin-bottom: 50px;
    }


    /*
       Layout 1
       phía dưới
    */

    .layout1 {
      grid-area: layout1;

      width: 570px;

      justify-self: center;
    }


    /* =====================================================
       TITLE + ACTIONS
       FIX TRIỆT ĐỂ: tiêu đề và nút luôn ở 2 hàng riêng
    ===================================================== */

    .layout-title {
      position: static;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 7px;

      width: 100%;
      min-height: 0;
      margin-bottom: 8px;

      font-size: 19px;
      font-weight: bold;

      overflow: visible;
    }

    .layout-title > span {
      position: static;
      display: block;

      width: 100%;
      min-width: 0;

      text-align: center;
      white-space: nowrap;

      line-height: 1.25;
    }

    .layout-title small {
      font-size: 11px;
      font-weight: normal;
      color: #777;
    }


    /* =====================================================
       ACTIONS
       Không dùng absolute nữa nên không thể chồng lên tên
    ===================================================== */

    .layout-actions {
      position: static !important;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;

      width: 100%;
      min-width: 0;

      gap: 5px;
      margin: 0;
      padding: 0;
    }

    .mini-btn {
      flex: 0 0 30px;

      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0;
      padding: 0;

      border: 1px solid #ccc;
      border-radius: 50%;

      background: white;

      font-size: 0;
      cursor: pointer;
    }

    .mini-btn[data-action="add-row"]::after {
      content: "+H";
      font-size: 10px;
      font-weight: bold;
    }

    .mini-btn[data-action="delete-row"]::after {
      content: "-H";
      font-size: 10px;
      font-weight: bold;
    }

    .mini-btn[data-action="add-col"]::after {
      content: "+C";
      font-size: 10px;
      font-weight: bold;
    }

    .mini-btn[data-action="delete-col"]::after {
      content: "-C";
      font-size: 10px;
      font-weight: bold;
    }

    .mini-btn[data-action="delete-row"],
    .mini-btn[data-action="delete-col"] {
      border-color: #d8a0a0;
      color: #b71c1c;
    }


    /* =====================================================
       LAYOUT 2
       Hẹp hơn nên giảm nhẹ nút, vẫn giữ 2 hàng độc lập
    ===================================================== */

    .layout2 .layout-title {
      gap: 6px;
    }

    .layout2 .layout-actions {
      gap: 4px;
    }

    .layout2 .mini-btn {
      flex-basis: 28px;
      width: 28px;
      height: 28px;
    }

    /* =====================================================
       GRID
    ===================================================== */

    .grid {
      display: grid;

      gap: 4px;
    }


    /* =====================================================
       SLOT
    ===================================================== */

    .slot {
      height: 78px;

      min-width: 0;

      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 5px;

      border: 2px solid #222;

      background: white;

      text-align: center;

      cursor: pointer;

      user-select: none;
      
      touch-action: pan-x pan-y;

      -webkit-tap-highlight-color: transparent;
    }


    .slot:active {
      background: #eee;
    }
    
    /* =====================================================
   TRẠNG THÁI Ô
===================================================== */

/* Ô có xe */
.slot.has-vehicle {
  background: #ffffff;
}

/* Ô trống */
.slot.is-empty {
  background: #f3f4f6;
}

/* Chữ TRỐNG */
.slot.is-empty .vehicle {
  color: #b5b8bd;
  font-weight: normal;
}


    .slot.selected {
      background: #e5e5e5;

      outline: 4px solid #222;

      outline-offset: -4px;
    }


    .slot-id {
      position: absolute;

      top: 3px;
      left: 4px;

      color: #aaa;

      font-size: 8px;
    }


    .vehicle {
      max-width: 100%;

      font-size: 13px;

      font-weight: bold;

      line-height: 1.2;

      overflow-wrap: anywhere;
    }


    .empty {
      color: #bbb;

      font-size: 10px;

      font-weight: normal;
    }


    /*
       Layout 2 cao vừa phải
    */

    .layout2 .slot {
      height: 70px;
    }


    /*
       Layout 1 thấp hơn một chút
       giống sơ đồ gốc
    */

    .layout1 .slot {
      height: 72px;
    }


    /* =====================================================
       LOADING
    ===================================================== */

    #loading {
      padding: 30px;

      text-align: center;

      color: #777;
    }


    /* =====================================================
       MODAL
    ===================================================== */

    .modal-backdrop {
      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.42);

      align-items: center;
      justify-content: center;

      padding: 14px;

      z-index: 999;
    }


    .modal-backdrop.show {
      display: flex;
    }


    .modal {
      width: 100%;

      max-width: 420px;

      padding: 16px;

      background: white;

      border-radius: 14px;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.2);
    }


    .modal h3 {
      margin: 0 0 14px;

      font-size: 18px;
    }


    .field {
      margin-bottom: 13px;
    }


    .field label {
      display: block;

      margin-bottom: 5px;

      color: #666;

      font-size: 12px;
    }


    .field input,
    .field select {
      width: 100%;

      min-height: 46px;

      padding: 8px 10px;

      border: 1px solid #ccc;

      border-radius: 8px;

      background: white;

      font-size: 16px;
    }


    .modal-actions {
      display: flex;

      justify-content: flex-end;

      gap: 8px;

      flex-wrap: wrap;
    }


    .modal-actions button {
      min-height: 42px;

      padding: 8px 13px;

      border: 0;

      border-radius: 8px;

      cursor: pointer;
    }


    .btn-primary {
      background: #222;

      color: white;
    }


    .btn-light {
      background: #eee;

      color: #222;
    }


    .btn-danger {
      background: #c62828;

      color: white;
    }


    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;

      left: 50%;

      bottom: 20px;

      transform:
        translateX(-50%);

      max-width:
        calc(100% - 30px);

      padding: 9px 14px;

      border-radius: 20px;

      background: #222;

      color: white;

      font-size: 13px;

      text-align: center;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .2s;

      z-index: 2000;
    }


    .toast.show {
      opacity: 1;
    }
    
    /* =====================================================
   TOUCH DRAG
===================================================== */

.slot.drag-source {
  opacity: .45;
  background: #eee;
}

.slot.drag-target {
  background: #e7f0ff;

  outline: 4px solid #333;
  outline-offset: -4px;
}

.drag-ghost {
  position: fixed;

  z-index: 5000;

  min-width: 80px;
  max-width: 150px;

  padding: 10px 14px;

  border-radius: 10px;

  background: #222;
  color: white;

  font-size: 13px;
  font-weight: bold;

  text-align: center;

  pointer-events: none;

  transform:
    translate(-50%, -50%);

  box-shadow:
    0 6px 20px
    rgba(0,0,0,.25);
}


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      body {
        padding: 7px;
      }


      .header h1 {
        font-size: 18px;
      }


      .header p {
        font-size: 11px;
      }


      .toolbar button {
        min-height: 36px;

        padding: 6px 10px;

        font-size: 12px;
      }


      /*
         Cho phép kéo ngang mặt bằng nếu cần.

         Không ép sơ đồ nhỏ đến mức
         chữ và ô khó thao tác.
      */

      .map-wrapper {
        padding: 8px;

        overflow-x: auto;

        -webkit-overflow-scrolling: touch;
      }


      .factory-map {
        min-width: 720px;

        grid-template-columns:
          minmax(0, 1fr)
          160px;

        column-gap: 45px;

        row-gap: 55px;

        padding: 5px 10px 20px;
      }


      .layout3 {
        width: 440px;
      }


      .layout2 {
        width: 160px;

        margin-bottom: 40px;
      }


      .layout1 {
        width: 510px;
      }


      .layout-title {
        font-size: 17px;
      }


      .slot {
        height: 68px;
      }


      .layout1 .slot {
        height: 65px;
      }


      .layout2 .slot {
        height: 65px;
      }


      .vehicle {
        font-size: 11px;
      }


      .slot-id {
        font-size: 7px;
      }

    }
    
    
    .factory-map.exporting {
  background: #fff;
  padding: 30px;
}

/* =====================================================
   TIÊU ĐỀ KHI XUẤT ẢNH
===================================================== */

.factory-map {
  position: relative;
}

.export-map-title {
  position: absolute;

  /*
   * Neo từ MÉP PHẢI của toàn bộ factory-map.
   * Khối sẽ mở rộng từ phải sang trái.
   */
  left: auto;
right: auto;
top: 0;

width: auto;
height: 100px;
  height: 100px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 0;

  text-align: center;

  z-index: 50;
  pointer-events: none;
}

.export-main-title {
  width: 100%;

  margin: 0;

  font-size: 23px;
  line-height: 1.2;
  font-weight: 700;

  color: #222;

  text-align: center;
  white-space: nowrap;
}

.export-date {
  width: 100%;

  margin-top: 10px;

  font-size: 15px;
  line-height: 1.2;
  font-weight: normal;

  color: #555;

  text-align: center;
  white-space: nowrap;
}


/* =====================================================
   TÌM KIẾM XE
===================================================== */

.vehicle-search {
  margin-bottom: 12px;
}

.vehicle-search-box {
  display: flex;
  gap: 6px;

  max-width: 420px;
}

.vehicle-search-box input {
  flex: 1;

  min-width: 0;
  height: 40px;

  padding: 0 12px;

  border: 1px solid #ccc;
  border-radius: 8px;

  background: white;

  font-size: 14px;
  outline: none;
}

.vehicle-search-box input:focus {
  border-color: #1976d2;
}

.vehicle-search-box button {
  height: 40px;

  padding: 0 13px;

  border: 1px solid #ccc;
  border-radius: 8px;

  background: white;

  cursor: pointer;
}

.vehicle-search-box #vehicleSearchBtn {
  background: #1976d2;
  border-color: #1976d2;
  color: white;

  font-weight: bold;
}

.vehicle-search-box .search-clear {
  width: 40px;
  padding: 0;
}


/* Kết quả tìm kiếm */

.vehicle-search-result {
  min-height: 18px;

  margin-top: 6px;

  font-size: 12px;
  color: #666;
}


/* =====================================================
   Ô XE ĐƯỢC TÌM THẤY
===================================================== */

.slot.search-match {
  background: #d9f0ff !important;

  border-color: #008cff !important;

  box-shadow:
    0 0 0 2px #008cff,
    0 0 12px rgba(0, 140, 255, .35);

  z-index: 5;
}

.slot.search-match .vehicle {
  color: #005ca8 !important;
  font-weight: 700;
}

.slot.search-match .slot-id {
  color: #0074c8 !important;
}


/* Mobile */

@media (max-width: 600px) {

  .vehicle-search-box {
    max-width: none;
    width: 100%;
  }

  .vehicle-search-box input {
    font-size: 16px;
  }

}
  .vehicle-note-view { white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; background: #f3f4f6; border-radius: 8px; min-height: 52px; font-size: 14px; }
  #vehicleNoteInput { width: 100%; min-height: 95px; resize: vertical; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font: 16px Arial,sans-serif; }
  #vehicleInfoBlock { line-height: 1.8; font-size: 14px; }

/* MOBILE VIEW: giao diện độc lập, không thay đổi sơ đồ gốc */
.view-switch { margin-left:auto; background:#e8f1ff!important; border-color:#91b9ed!important; font-weight:700; }

/* MOBILE GRID V4: tọa độ hàng/cột thật, không dùng danh sách 2 cột */
body.mobile-view .mobile-grid-scroll {
  width:100%; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain; padding:3px 2px 8px;

}

}
body.mobile-view .mobile-layout-map .slot.is-empty .vehicle {font-size:8px !important;font-weight:400;}

<script>
/* Định dạng thông báo: escape HTML trước khi áp dụng Markdown đơn giản. */
function renderNoticeMarkdown(value) {
  const escaped = String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
  return escaped
    .replace(/\*\*\*([^*\n]+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
}
function insertNoticeFormatting(marker) {
  const area = document.getElementById('noticeBodyInput');
  const start = area.selectionStart, end = area.selectionEnd;
  const selected = area.value.slice(start, end) || 'Nội dung';
  area.setRangeText(marker + selected + marker, start, end, 'select');
  area.focus();
  area.setSelectionRange(start + marker.length, start + marker.length + selected.length);
  previewNoticeFormatting();
}
function previewNoticeFormatting() {
  const content = document.getElementById('noticeBodyInput').value;
  document.getElementById('noticePreviewContent').innerHTML = renderNoticeMarkdown(content || 'Nội dung xem trước sẽ hiển thị ở đây.');
}
/* THÔNG BÁO TRUY CẬP - chỉ tự mở một lần trên mỗi trình duyệt */
const SITE_NOTICE_SEEN_KEY = 'vehicle_layout_notice_seen_v1';
let siteNoticeData = {title:'',content:''};
function initSiteNotice() {
  const byId = id => document.getElementById(id);
  byId('noticeViewBtn').addEventListener('click', () => openSiteNotice(false));
  byId('noticeAdminBtn').addEventListener('click', openNoticeEditor);
  byId('noticeCloseBtn').addEventListener('click', () => byId('noticeViewModal').classList.remove('show'));
  byId('noticeCancelEditBtn').addEventListener('click', () => byId('noticeEditModal').classList.remove('show'));
  byId('noticeSaveBtn').addEventListener('click', saveSiteNotice);
  byId('noticeBoldBtn').addEventListener('click', () => insertNoticeFormatting('**'));
  byId('noticeItalicBtn').addEventListener('click', () => insertNoticeFormatting('*'));
  byId('noticePreviewBtn').addEventListener('click', previewNoticeFormatting);
  ['noticeViewModal','noticeEditModal'].forEach(id => {
    byId(id).addEventListener('click', event => { if (event.target === byId(id)) byId(id).classList.remove('show'); });
  });
  google.script.run.withSuccessHandler(data => {
    siteNoticeData = data || {title:'',content:''};
    const hasContent = String(siteNoticeData.title || '').trim() || String(siteNoticeData.content || '').trim();
    let seen = false;
    try { seen = localStorage.getItem(SITE_NOTICE_SEEN_KEY) === '1'; } catch (_) {}
    if (hasContent && !seen) openSiteNotice(true);
  }).withFailureHandler(showError).getSiteNotice();
}
function openSiteNotice(isAutomatic) {
  const title = String(siteNoticeData.title || '').trim();
  const content = String(siteNoticeData.content || '').trim();
  document.getElementById('noticeViewTitle').textContent = '📢 ' + (title || 'Thông báo');
  document.getElementById('noticeViewContent').innerHTML = renderNoticeMarkdown(content || 'Hiện chưa có nội dung thông báo.');
  document.getElementById('noticeViewModal').classList.add('show');
  if (isAutomatic) {
    try { localStorage.setItem(SITE_NOTICE_SEEN_KEY,'1'); } catch (_) {}
  }
}
function openNoticeEditor() {
  if (!isAdminUnlocked || !adminToken) { showToast('Vui lòng mở khóa quản trị'); return; }
  document.getElementById('noticeTitleInput').value = siteNoticeData.title || '';
  document.getElementById('noticeBodyInput').value = siteNoticeData.content || '';
  previewNoticeFormatting();
  document.getElementById('noticeEditModal').classList.add('show');
}
function saveSiteNotice() {
  if (!isAdminUnlocked || !adminToken) { showToast('Vui lòng mở khóa quản trị'); return; }
  const btn = document.getElementById('noticeSaveBtn');
  const title = document.getElementById('noticeTitleInput').value.trim();
  const content = document.getElementById('noticeBodyInput').value.trim();
  if (!title) { showToast('Vui lòng nhập tiêu đề'); return; }
  btn.disabled = true;
  google.script.run.withSuccessHandler(data => {
    siteNoticeData = data || {title,content};
    document.getElementById('noticeEditModal').classList.remove('show');
    btn.disabled = false;
    showToast('Đã lưu thông báo');
  }).withFailureHandler(error => { btn.disabled = false; showError(error); })
    .saveSiteNotice(title,content,adminToken);
}

</script>

<script>
// Vercel compatibility layer for existing google.script.run chains.
(function () {
  function createRunner(success, failure) {
    const chain = {
      withSuccessHandler(fn) { return createRunner(fn, failure); },
      withFailureHandler(fn) { return createRunner(success, fn); }
    };
    return new Proxy(chain, {
      get(target, prop) {
        if (prop in target) return target[prop];
        if (prop === 'then') return undefined;
        return (...args) => {
          fetch('/api/gas', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({action: String(prop), args})
          }).then(async res => {
            const payload = await res.json().catch(() => ({}));
            if (!res.ok || !payload.success) {
              throw new Error(payload.error || 'Không kết nối được máy chủ (' + res.status + ')');
            }
            if (typeof success === 'function') success(payload.data);
          }).catch(error => {
            if (typeof failure === 'function') failure(error);
            else console.error(error);
          });
        };
      }
    });
  }
  window.google = window.google || {};
  window.google.script = window.google.script || {};
  window.google.script.run = createRunner(null, null);
})();
</script>

<script>

/* =====================================================
   GLOBAL
===================================================== */

let allData = [];

let vehicleList = [];
let vehicleNotes = {};

let currentSlot = null;

let mode = 'normal';


/*
   Trạng thái quản trị.

   KHÔNG lưu localStorage.
   KHÔNG lưu sessionStorage.

   Vì vậy F5 = khóa lại.
*/

let isAdminUnlocked = false;

let adminToken = '';

let firstSelectedSlot = null;

let toastTimer = null;

let dragTimer = null;

let dragSourceItem = null;

let dragSourceElement = null;

let dragTargetElement = null;

let dragGhost = null;

let isDragging = false;

let suppressClick = false;

const HOLD_TO_DRAG_MS = 400;



/* =====================================================
   MOBILE VIEW / CHUYỂN ĐỔI GIAO DIỆN
   Sử dụng cùng allData, handleSlotClick và API gốc.
===================================================== */
let mobileLayoutFilter = 'all';
// Luôn khởi động ở Mobile; chế độ Sơ đồ chỉ có hiệu lực trong phiên trang hiện tại.
let currentView = 'mobile';
function initViewSwitch() {
  const button = document.getElementById('viewSwitchBtn');
  if (!button) return;
  currentView = 'mobile';
  // Xóa tùy chọn cũ để không còn tác động từ các phiên bản trước.
  try { localStorage.removeItem('vehicle_view_mode'); } catch (_) {}
  applyViewMode();
  button.addEventListener('click', function () {
    currentView = currentView === 'mobile' ? 'desktop' : 'mobile';
    applyViewMode();
  });
}
/* Fix cho Chrome Android đang ép trang về viewport desktop ~980px.
   Zoom tại HTML để viewport CSS trở lại kích thước màn hình thực.
   Không scale sơ đồ Desktop hay canvas xuất ảnh. */
function fixMobileViewport() {
  const root = document.documentElement;
  if (currentView !== 'mobile') {
    root.style.zoom = '';
    return;
  }
  root.style.zoom = '';
  const sw = Math.min(Number(screen.width)||400, Number(screen.height)||900);
  const vw = window.innerWidth || document.documentElement.clientWidth;
  const ratio = vw / sw;
  if (ratio > 1.25 && ratio < 4.5) {
    root.style.zoom = String(Math.min(3.5, ratio));
  }
}
function applyViewMode() {
  document.body.classList.toggle('mobile-view', currentView === 'mobile');
  fixMobileViewport();
  const button = document.getElementById('viewSwitchBtn');
  if (button) button.textContent = currentView === 'mobile'
    ? '🖥️ Giao diện Sơ đồ' : '📱 Giao diện Mobile';
  if (currentView === 'mobile') renderMobileBoard();
}
window.addEventListener('orientationchange', () => {
  setTimeout(fixMobileViewport, 250);
});
function renderMobileBoard() {
  const filters = document.getElementById('mobileFilters');
  const sections = document.getElementById('mobileSections');
  if (!filters || !sections) return;
  filters.replaceChildren();
  sections.replaceChildren();
  const choices = [['all','Tất cả'],['Layout 1','Layout 1'],['Layout 2','Layout 2'],['Layout 3','Layout 3']];
  choices.forEach(([value,label]) => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = label;
    if (value === mobileLayoutFilter) btn.classList.add('active');
    btn.addEventListener('click', () => { mobileLayoutFilter = value; renderMobileBoard(); });
    filters.appendChild(btn);
  });
  ['Layout 1','Layout 2','Layout 3'].forEach(layout => {
    if (mobileLayoutFilter !== 'all' && mobileLayoutFilter !== layout) return;
    const items = allData.filter(item => item.layout === layout)
      .slice().sort((a,b) => a.row - b.row || a.col - b.col);
    const section = document.createElement('section');
    section.className = 'mobile-section';
    const head = document.createElement('div'); head.className = 'mobile-section-header';
    const title = document.createElement('h3'); title.textContent = '🚚 ' + layout;
    const count = document.createElement('span'); count.className = 'mobile-count';
    count.textContent = items.filter(x => x.vehicle).length + '/' + items.length + ' vị trí';
    head.append(title,count); section.appendChild(head);
    if (isAdminUnlocked) {
      const actions = document.createElement('div'); actions.className = 'mobile-actions';
      [['add-row','+ Hàng'],['delete-row','− Hàng'],['add-col','+ Cột'],['delete-col','− Cột']]
        .forEach(([action,label]) => {
          const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = label;
          btn.addEventListener('click', () => {
            const original = document.querySelector('.factory-map [data-action="' + action + '"][data-layout="' + layout + '"]');
            if (original) original.click();
          });
          actions.appendChild(btn);
        });
      section.appendChild(actions);
    }
    // Lưới dùng tọa độ HANG/COT thật từ Sheet, không tự xếp thành 2 cột.
    const maxCol = Math.max(1, ...items.map(x => Number(x.col) || 1));
    const maxRow = Math.max(1, ...items.map(x => Number(x.row) || 1));
    const scroll = document.createElement('div');
    scroll.className = 'mobile-grid-scroll';
    scroll.setAttribute('aria-label', 'Sơ đồ ' + layout + ' theo đúng hàng và cột');
    const grid = document.createElement('div');
    grid.className = 'mobile-grid mobile-layout-map';
    grid.style.setProperty('--mobile-cols', maxCol);
    grid.style.setProperty('--mobile-rows', maxRow);
    // Mỗi cột rộng tối thiểu 49px; nếu quá nhiều cột, chỉ lưới cuộn ngang.
    grid.style.minWidth = (maxCol * 49 + Math.max(0,maxCol-1)*4) + 'px';
    items.forEach(item => {
      const slot = document.createElement('div');
      slot.className = 'slot ' + (item.vehicle ? 'has-vehicle' : 'is-empty');
      if (firstSelectedSlot && firstSelectedSlot.id === item.id) slot.classList.add('selected');
      slot.dataset.id = item.id;
      slot.dataset.row = item.row;
      slot.dataset.col = item.col;
      slot.style.gridRow = String(Number(item.row) || 1);
      slot.style.gridColumn = String(Number(item.col) || 1);
      slot.title = (item.po ? 'PO: ' + item.po + ' — ' : '') + (item.vehicle || 'TRỐNG');
      const id = document.createElement('div'); id.className = 'slot-id'; id.textContent = item.vehicle && String(item.po || '').trim() ? 'PO ' + String(item.po).trim() : '';
      const vehicle = document.createElement('div'); vehicle.className = 'vehicle';
      vehicle.textContent = item.vehicle || 'TRỐNG';
      if (!item.vehicle) vehicle.classList.add('empty');
      slot.append(id,vehicle);
      slot.addEventListener('click', () => {
        handleSlotClick(item);
        if (mode === 'move' || mode === 'swap') renderMobileBoard();
      });
      grid.appendChild(slot);
    });
    scroll.appendChild(grid);
    if (maxCol >= 6) {
      const hint = document.createElement('div');
      hint.className = 'mobile-map-hint';
      hint.textContent = '↔ Vuốt ngang nếu cần • Chạm ô để xem đầy đủ tên xe và ghi chú';
      section.appendChild(hint);
    }
    section.appendChild(scroll); sections.appendChild(section);
  });
}

/* =====================================================
   SEARCH VEHICLE
===================================================== */

function searchVehicle() {

  const input =
    document.getElementById(
      'vehicleSearchInput'
    );

  const result =
    document.getElementById(
      'vehicleSearchResult'
    );

  const keyword =
    input.value
      .trim()
      .toLowerCase();


  // Xóa kết quả tìm kiếm cũ
  document
    .querySelectorAll(
      '.slot.search-match'
    )
    .forEach(function(slot) {

      slot.classList.remove(
        'search-match'
      );

    });


  // Không nhập gì
  if (!keyword) {

    result.textContent =
      'Nhập tên xe cần tìm.';

    return;

  }


  /*
     Tìm trong dữ liệu hiện tại.

     So sánh không phân biệt
     chữ hoa / chữ thường.
  */

  const matches =
    allData.filter(
      function(item) {

        if (!item.vehicle) {
          return false;
        }

        return (
          String(item.vehicle)
            .trim()
            .toLowerCase()
            .includes(keyword)
        );

      }
    );


  /*
     KHÔNG TÌM THẤY
  */

  if (!matches.length) {

    result.textContent =
      'Không có xe "' +
      input.value.trim() +
      '".';

    result.style.color =
      '#c62828';

    showToast(
      'Không tìm thấy xe'
    );

    return;

  }


  /*
     TÌM THẤY

     Tô màu tất cả ô chứa
     xe phù hợp.
  */

  matches.forEach(
    function(item) {

      const slot =
        document.querySelector(
          '.slot[data-id="' +
          item.id +
          '"]'
        );

      if (slot) {

        slot.classList.add(
          'search-match'
        );

      }

    }
  );


  /*
     Hiển thị kết quả
  */

  result.style.color =
    '#087f23';

  result.textContent =
    'Tìm thấy ' +
    matches.length +
    ' xe.';


  /*
     Cuộn tới xe đầu tiên.
  */

  const firstMatch =
    document.querySelector(
      '.slot.search-match'
    );

  if (firstMatch) {

    firstMatch.scrollIntoView({
      behavior: 'smooth',
      block: 'center',
      inline: 'center'
    });

  }


  document.querySelectorAll('#mobileBoard .slot').forEach(slot => {
    slot.classList.toggle('search-match', matches.some(item => item.id === slot.dataset.id));
  });
  if (currentView === 'mobile') {
    mobileLayoutFilter = 'all';
    renderMobileBoard();
    document.querySelectorAll('#mobileBoard .slot').forEach(slot => {
      slot.classList.toggle('search-match', matches.some(item => item.id === slot.dataset.id));
    });
    const firstMobile = document.querySelector('#mobileBoard .slot.search-match');
    if (firstMobile) firstMobile.scrollIntoView({behavior:'smooth',block:'center'});
  }
  showToast(
    'Tìm thấy ' +
    matches.length +
    ' xe'
  );

}

/* =====================================================
   RENDER GRID
===================================================== */

function renderGrid(
  elementId,
  layoutName
) {

  const data =
    allData.filter(
      function(x) {

        return (
          x.layout === layoutName
        );

      }
    );


  const container =
    document.getElementById(
      elementId
    );


  container.innerHTML = '';


  if (!data.length) {
    return;
  }


  /*
     Số cột thực tế.

     Khi thêm cột,
     grid tự thay đổi.
  */

  const maxCol =
    Math.max.apply(
      null,
      data.map(
        function(x) {

          return x.col;

        }
      )
    );


  container.style.gridTemplateColumns =
    'repeat(' +
    maxCol +
    ', minmax(0, 1fr))';


  /*
     Sắp xếp:
     hàng trước -> cột sau.
  */

  data.sort(
    function(a, b) {

      if (
        a.row !== b.row
      ) {

        return (
          a.row - b.row
        );

      }


      return (
        a.col - b.col
      );

    }
  );


  data.forEach(
    function(item) {

      const slot =
        document.createElement(
          'div'
        );


      slot.className =
        'slot';


      slot.dataset.id =
        item.id;


      /* ID */

      const id =
        document.createElement(
          'div'
        );


      id.className =
        'slot-id';


      id.textContent =
        item.vehicle && String(item.po || '').trim() ? 'PO ' + String(item.po).trim() : '';


      /* VEHICLE */

      const vehicle =
        document.createElement(
          'div'
        );


      vehicle.className =
        'vehicle';


      if (item.vehicle) {

  vehicle.textContent =
    item.vehicle;

  slot.classList.add(
    'has-vehicle'
  );

} else {

  vehicle.textContent =
    'TRỐNG';

  vehicle.classList.add(
    'empty'
  );

  slot.classList.add(
    'is-empty'
  );

}


      slot.appendChild(
        id
      );


      slot.appendChild(
        vehicle
      );


      bindSlotTouch(
  slot,
  item
);


      container.appendChild(
        slot
      );

    }
  );


  updateCount(
    layoutName,
    data
  );

}


/* =====================================================
   TOUCH DRAG & DROP
===================================================== */

function bindSlotTouch(
  slot,
  item
) {

  /*
     CLICK bình thường
  */

  slot.addEventListener(
    'click',
    function(event) {

      if (suppressClick) {

        event.preventDefault();

        return;

      }


      handleSlotClick(
        item
      );

    }
  );


  /*
     Bắt đầu giữ
  */

  slot.addEventListener(
    'pointerdown',
    function(event) {

      /*
         Chỉ kéo khi:
         - đang ở chế độ Chọn xe
         - ô có xe
      */

      if (
  !isAdminUnlocked ||
  mode !== 'normal' ||
  !item.vehicle
) {

        return;

      }


      /*
         Chuột desktop chỉ nhận nút trái.
      */

      if (
        event.pointerType === 'mouse' &&
        event.button !== 0
      ) {

        return;

      }


      clearTimeout(
        dragTimer
      );


      dragTimer =
        setTimeout(
          function() {

            startTouchDrag(
              slot,
              item,
              event.clientX,
              event.clientY
            );

          },
          HOLD_TO_DRAG_MS
        );

    }
  );


  /*
     Nếu người dùng di chuyển trước khi
     đủ thời gian nhấn giữ thì hủy.

     Sau khi drag đã bắt đầu thì xử lý kéo.
  */

  slot.addEventListener(
    'pointermove',
    function(event) {

      if (!isDragging) {
        return;
      }


      event.preventDefault();


      updateTouchDrag(
        event.clientX,
        event.clientY
      );

    }
  );


  slot.addEventListener(
    'pointerup',
    function(event) {

      clearTimeout(
        dragTimer
      );


      if (!isDragging) {
        return;
      }


      event.preventDefault();


      finishTouchDrag(
        event.clientX,
        event.clientY
      );

    }
  );


  slot.addEventListener(
    'pointercancel',
    function() {

      clearTimeout(
        dragTimer
      );


      if (
        isDragging
      ) {

        cancelTouchDrag();

      }

    }
  );

}


/* =====================================================
   START DRAG
===================================================== */

/* =====================================================
   START DRAG
===================================================== */

function startTouchDrag(
  slot,
  item,
  x,
  y
) {

  /*
     Khi đang khóa quản trị
     tuyệt đối không cho kéo.
  */

  if (
    !isAdminUnlocked
  ) {
    return;
  }


  /*
     Nếu đang kéo rồi
     thì không tạo drag mới.
  */

  if (
    isDragging
  ) {
    return;
  }


  isDragging =
    true;


  suppressClick =
    true;


  dragSourceItem =
    item;


  dragSourceElement =
    slot;


  slot.classList.add(
    'drag-source'
  );


  /*
     Tạo nhãn nổi
     theo ngón tay.
  */

  dragGhost =
    document.createElement(
      'div'
    );


  dragGhost.className =
    'drag-ghost';


  dragGhost.textContent =
    item.vehicle;


  document.body.appendChild(
    dragGhost
  );


  moveDragGhost(
    x,
    y
  );


  /*
     Rung nhẹ nếu thiết bị hỗ trợ.
  */

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      30
    );

  }


  showToast(
    'Kéo ' +
    item.vehicle +
    ' sang vị trí mới'
  );

}


/* =====================================================
   MOVE DRAG
===================================================== */

function updateTouchDrag(
  x,
  y
) {

  if (
    !isDragging
  ) {
    return;
  }


  moveDragGhost(
    x,
    y
  );


  /*
     Ghost có pointer-events:none
     nên elementFromPoint sẽ thấy
     slot phía dưới.
  */

  const element =
    document.elementFromPoint(
      x,
      y
    );


  const slot =
    element
      ? element.closest('.slot')
      : null;


  /*
     Xóa target cũ
  */

  if (
    dragTargetElement &&
    dragTargetElement !== slot
  ) {

    dragTargetElement
      .classList
      .remove(
        'drag-target'
      );

  }


  /*
     Không coi chính ô nguồn
     là target.
  */

  if (
    slot &&
    slot !== dragSourceElement
  ) {

    dragTargetElement =
      slot;


    dragTargetElement
      .classList
      .add(
        'drag-target'
      );

  } else {

    dragTargetElement =
      null;

  }

}


/* =====================================================
   GHOST
===================================================== */

function moveDragGhost(
  x,
  y
) {

  if (
    !dragGhost
  ) {
    return;
  }


  dragGhost.style.left =
    x + 'px';


  dragGhost.style.top =
    (y - 35) + 'px';

}


/* =====================================================
   FINISH DRAG
===================================================== */

function finishTouchDrag(
  x,
  y
) {

  updateTouchDrag(
    x,
    y
  );


  if (
    !dragSourceItem ||
    !dragTargetElement
  ) {

    cancelTouchDrag();

    return;

  }


  const source =
    dragSourceItem;


  const targetId =
    dragTargetElement.dataset.id;


  const target =
    allData.find(
      function(item) {

        return (
          item.id === targetId
        );

      }
    );


  if (
    !target ||
    target.id === source.id
  ) {

    cancelTouchDrag();

    return;

  }


  /*
     Lưu thông tin trước khi cleanup.
  */

  const sourceId =
    source.id;


  const destinationId =
    target.id;


  const destinationHasVehicle =
    !!target.vehicle;


  cleanupTouchDrag();


  /*
     Nếu đích đang có xe
     -> ĐỔI CHỖ
  */

  if (
    destinationHasVehicle
  ) {

    showToast(
      'Đang đổi chỗ...'
    );


    google.script.run

      .withSuccessHandler(
        function() {

          showToast(
            'Đã đổi chỗ'
          );


          reloadData();

        }
      )

      .withFailureHandler(
        showError
      )

      .swapSlots(
  sourceId,
  destinationId,
  adminToken
);


    return;

  }


  /*
     Nếu đích trống
     -> DI CHUYỂN
  */

  showToast(
    'Đang di chuyển...'
  );


  google.script.run

    .withSuccessHandler(
      function() {

        showToast(
          'Đã di chuyển xe'
        );


        reloadData();

      }
    )

    .withFailureHandler(
      showError
    )

    .moveVehicle(
  sourceId,
  destinationId,
  adminToken
);

}


/* =====================================================
   CANCEL DRAG
===================================================== */

function cancelTouchDrag() {

  cleanupTouchDrag();


  showToast(
    'Đã hủy kéo'
  );

}


/* =====================================================
   CLEANUP DRAG
===================================================== */

function cleanupTouchDrag() {

  clearTimeout(
    dragTimer
  );


  if (
    dragSourceElement
  ) {

    dragSourceElement
      .classList
      .remove(
        'drag-source'
      );

  }


  if (
    dragTargetElement
  ) {

    dragTargetElement
      .classList
      .remove(
        'drag-target'
      );

  }


  if (
    dragGhost
  ) {

    dragGhost.remove();

  }


  dragSourceItem =
    null;


  dragSourceElement =
    null;


  dragTargetElement =
    null;


  dragGhost =
    null;


  isDragging =
    false;


  /*
     Pointerup thường phát sinh click ngay sau đó.

     Chờ một chút rồi mới cho click lại,
     nếu không modal Chọn xe sẽ bật lên.
  */

  setTimeout(
    function() {

      suppressClick =
        false;

    },
    300
  );

}

/* =====================================================
   COUNT
===================================================== */

function updateCount(
  layoutName,
  data
) {

  const used =
    data.filter(
      function(x) {

        return x.vehicle;

      }
    ).length;


  let target = '';


  if (
    layoutName ===
    'Layout 1'
  ) {

    target =
      'count1';

  }


  if (
    layoutName ===
    'Layout 2'
  ) {

    target =
      'count2';

  }


  if (
    layoutName ===
    'Layout 3'
  ) {

    target =
      'count3';

  }


  if (!target) {
    return;
  }


  document
    .getElementById(
      target
    )
    .textContent =
    ' (' +
    used +
    '/' +
    data.length +
    ')';

}


/* =====================================================
   SLOT CLICK
===================================================== */

function handleSlotClick(
  item
) {

  if (!isAdminUnlocked) {
    if (item.vehicle) openVehicleModal(item);
    return;
  }

  if (
    mode === 'normal'
  ) {

    openVehicleModal(
      item
    );

    return;

  }


  if (
    mode === 'move' ||
    mode === 'swap'
  ) {

    handleTwoSlotMode(
      item
    );

  }

}


/* =====================================================
   MOVE / SWAP
===================================================== */

function handleTwoSlotMode(
  item
) {

  /*
     Chọn ô đầu tiên
  */

  if (
    !firstSelectedSlot
  ) {

    firstSelectedSlot =
      item;


    markSelected(
      item.id
    );


    showToast(
      'Đã chọn ' +
      item.id +
      '. Chọn ô thứ hai.'
    );


    return;

  }


  /*
     Chạm lại ô cũ
     -> hủy
  */

  if (
    firstSelectedSlot.id ===
    item.id
  ) {

    clearSelection();


    showToast(
      'Đã hủy lựa chọn'
    );


    return;

  }


  const first =
    firstSelectedSlot;


  clearSelection();


  /* =========================
     DI CHUYỂN
  ========================== */

  if (
    mode === 'move'
  ) {

    google.script.run

      .withSuccessHandler(
        function() {

          showToast(
            'Đã di chuyển xe'
          );


          reloadData();

        }
      )

      .withFailureHandler(
        showError
      )

      .moveVehicle(
  first.id,
  item.id,
  adminToken
);

  }


  /* =========================
     ĐỔI CHỖ
  ========================== */

  if (
    mode === 'swap'
  ) {

    google.script.run

      .withSuccessHandler(
        function() {

          showToast(
            'Đã đổi chỗ'
          );


          reloadData();

        }
      )

      .withFailureHandler(
        showError
      )

      .swapSlots(
  first.id,
  item.id,
  adminToken
);

  }

}


/* =====================================================
   SELECT
===================================================== */

function markSelected(
  slotId
) {

  document
    .querySelectorAll(
      '.slot'
    )
    .forEach(
      function(el) {

        el.classList.remove(
          'selected'
        );

      }
    );


  const slot =
    document.querySelector(
      '.slot[data-id="' +
      slotId +
      '"]'
    );


  if (slot) {

    slot.classList.add(
      'selected'
    );

  }

}


function clearSelection() {

  firstSelectedSlot =
    null;


  document
    .querySelectorAll(
      '.slot'
    )
    .forEach(
      function(el) {

        el.classList.remove(
          'selected'
        );

      }
    );

}


/* =====================================================
   OPEN MODAL
===================================================== */

function openVehicleModal(
  item
) {

  currentSlot =
    item;


  document
    .getElementById(
      'modalTitle'
    )
    .textContent =
    (item.vehicle || 'Thêm xe') +
    ' - ' +
    item.layout;


  document
    .getElementById(
      'vehicleInput'
    )
    .value =
    item.vehicle || '';


  document
    .getElementById(
      'vehicleSelect'
    )
    .value =
    item.vehicle || '';


  document.getElementById('vehicleInfoName').textContent = item.vehicle || 'TRỐNG';
  document.getElementById('vehicleInfoPO').textContent = item.po || 'Chưa có PO';
  document.getElementById('vehiclePOInput').value = item.po || '';
  document.getElementById('vehicleInfoLayout').textContent = item.layout;
  updateVehicleNoteDisplay();
  const canEdit = isAdminUnlocked;
  document.getElementById('vehicleSelect').disabled = !canEdit;
  document.getElementById('vehicleInput').readOnly = !canEdit;
  document.getElementById('vehiclePOField').style.display = canEdit ? '' : 'none';
  document.getElementById('vehicleSelect').closest('.field').style.display = canEdit ? '' : 'none';
  document.getElementById('vehicleInput').closest('.field').style.display = canEdit ? '' : 'none';
  document.getElementById('vehicleNoteView').style.display = canEdit ? 'none' : 'block';
  document.getElementById('vehicleNoteInput').style.display = canEdit ? 'block' : 'none';
  document.getElementById('saveVehicleBtn').style.display = canEdit ? '' : 'none';
  document.getElementById('clearVehicleBtn').style.display = canEdit ? '' : 'none';
  document.getElementById('closeModalBtn').textContent = canEdit ? 'Hủy' : 'Đóng';

  document
    .getElementById(
      'vehicleModal'
    )
    .classList.add(
      'show'
    );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeVehicleModal() {

  document
    .getElementById(
      'vehicleModal'
    )
    .classList.remove(
      'show'
    );


  currentSlot =
    null;

}


/* =====================================================
   SAVE VEHICLE
===================================================== */

function saveVehicle() {
  if (!isAdminUnlocked || !adminToken) return;

  if (
    !currentSlot
  ) {
    return;
  }


  /*
     Lưu ID trước khi đóng modal.
  */

  const slotId =
    currentSlot.id;


  const inputValue =
    document
      .getElementById(
        'vehicleInput'
      )
      .value
      .trim();


  const selectValue =
    document
      .getElementById(
        'vehicleSelect'
      )
      .value
      .trim();


  const vehicle =
    inputValue ||
    selectValue;


  google.script.run

    .withSuccessHandler(
      function() {

        closeVehicleModal();


        showToast(
          'Đã lưu ' +
          slotId
        );


        reloadData();
        loadVehicleNotes();

      }
    )

    .withFailureHandler(
      showError
    )

    .saveVehicleAndNote(
  slotId,
  vehicle,
  document.getElementById('vehicleNoteInput').value,
  document.getElementById('vehiclePOInput').value,
  adminToken
);

}


/* =====================================================
   CLEAR VEHICLE
===================================================== */

function clearVehicle() {
  if (!isAdminUnlocked || !adminToken) return;

  if (
    !currentSlot
  ) {
    return;
  }


  const slotId =
    currentSlot.id;


  google.script.run

    .withSuccessHandler(
      function() {

        closeVehicleModal();


        showToast(
          'Đã xóa xe khỏi ' +
          slotId
        );


        reloadData();

      }
    )

    .withFailureHandler(
      showError
    )

    .updateSlotVehicle(
  slotId,
  '',
  adminToken
);

}


/* =====================================================
   BIND MODAL
===================================================== */

function bindModal() {

  document
    .getElementById(
      'saveVehicleBtn'
    )
    .addEventListener(
      'click',
      saveVehicle
    );


  document
    .getElementById(
      'clearVehicleBtn'
    )
    .addEventListener(
      'click',
      clearVehicle
    );


  document
    .getElementById(
      'closeModalBtn'
    )
    .addEventListener(
      'click',
      closeVehicleModal
    );


  /*
     Dropdown -> input
  */

  document
    .getElementById(
      'vehicleSelect'
    )
    .addEventListener(
      'change',
      function() {

        document
          .getElementById(
            'vehicleInput'
          )
          .value =
          this.value;

      }
    );


  /*
     Chạm nền tối
     -> đóng modal
  */

  document
    .getElementById(
      'vehicleModal'
    )
    .addEventListener(
      'click',
      function(event) {

        if (
          event.target === this
        ) {

          closeVehicleModal();

        }

    );

}


/* =====================================================
   ADMIN LOCK
===================================================== */

function bindAdminLock() {

  const lockBtn =
    document.getElementById(
      'adminLockBtn'
    );

  const confirmBtn =
    document.getElementById(
      'confirmAdminPinBtn'
    );

  const cancelBtn =
    document.getElementById(
      'cancelAdminPinBtn'
    );

  const input =
    document.getElementById(
      'adminPinInput'
    );


  lockBtn.addEventListener(
    'click',
    function() {

      if (isAdminUnlocked) {

        lockAdmin();

      } else {

        openAdminPinModal();

      }

    }
  );


  confirmBtn.addEventListener(
    'click',
    unlockAdmin
  );


  cancelBtn.addEventListener(
    'click',
    closeAdminPinModal
  );


  input.addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Enter'
      ) {

        event.preventDefault();

        unlockAdmin();

      }

    }
  );


  document
    .getElementById(
      'adminPinModal'
    )
    .addEventListener(
      'click',
      function(event) {

        if (
          event.target === this
        ) {

          closeAdminPinModal();

        }

      }
    );

}


/* =====================================================
   OPEN PIN
===================================================== */

function openAdminPinModal() {

  const modal =
    document.getElementById(
      'adminPinModal'
    );

  const input =
    document.getElementById(
      'adminPinInput'
    );


  input.value = '';

  modal.classList.add(
    'show'
  );


  setTimeout(
    function() {

      input.focus();

    },
    100
  );

}


/* =====================================================
   CLOSE PIN
===================================================== */

function closeAdminPinModal() {

  document
    .getElementById(
      'adminPinModal'
    )
    .classList.remove(
      'show'
    );

}


/* =====================================================
   UNLOCK
===================================================== */

function unlockAdmin() {

  const input =
    document.getElementById(
      'adminPinInput'
    );

  const pin =
    input.value.trim();


  if (!pin) {

    showToast(
      'Vui lòng nhập mã PIN'
    );

    input.focus();

    return;

  }


  google.script.run

    .withSuccessHandler(
      function(result) {

        if (
          !result ||
          !result.success ||
          !result.token
        ) {

          showToast(
            'Sai mã PIN'
          );

          input.value = '';

          input.focus();

          return;

        }


        adminToken =
          result.token;


        isAdminUnlocked =
          true;


        closeAdminPinModal();


        applyAdminLockState();


        showToast(
          '🔓 Đã mở khóa quản trị'
        );

      }
    )

    .withFailureHandler(
      showError
    )

    .verifyAdminPin(
      pin
    );

}


/* =====================================================
   LOCK
===================================================== */

function lockAdmin() {

  const oldToken =
    adminToken;


  /*
     Khóa giao diện ngay lập tức.
  */

  isAdminUnlocked =
    false;

  adminToken =
    '';

  mode =
    'normal';

  clearSelection();

  cleanupTouchDrag();

  closeVehicleModal();

  applyAdminLockState();


  showToast(
    '🔒 Đã khóa'
  );


  /*
     Xóa token phía server.
  */

  if (oldToken) {

    google.script.run
      .withFailureHandler(
        function() {}
      )
      .revokeAdminToken(
        oldToken
      );

  }

}


/* =====================================================
   APPLY LOCK STATE
===================================================== */

function applyAdminLockState() {

  const lockBtn =
    document.getElementById(
      'adminLockBtn'
    );


  lockBtn.textContent =
    isAdminUnlocked
      ? '🔓 Khóa lại'
      : '🔒 Mở khóa';


  /*
     3 chế độ chỉnh sửa.
  */

  [
    'normalModeBtn',
    'moveModeBtn',
    'swapModeBtn'
  ].forEach(
    function(id) {

      const button =
        document.getElementById(
          id
        );

      if (button) {

        button.style.display =
          isAdminUnlocked
            ? ''
            : 'none';

      }

    }
  );


  /*
     +H -H +C -C
  */

  document
    .querySelectorAll(
      '.layout-actions'
    )
    .forEach(
      function(actions) {

        actions.style.display =
          isAdminUnlocked
            ? ''
            : 'none';

      }
    );


  /*
     Khi khóa thì bỏ mọi lựa chọn.
  */

  if (!isAdminUnlocked) {

    mode = 'normal';

    clearSelection();

  }

  const noticeAdminBtn = document.getElementById('noticeAdminBtn');
  if (noticeAdminBtn) noticeAdminBtn.style.display = isAdminUnlocked ? '' : 'none';
  renderMobileBoard();

}

    document

      );

  message
) {

    document.getElementById(
      'toast'
    );


  toast.textContent =
    message;


  toast.classList.add(
    'show'
  );


  if (
    toastTimer
  ) {

    clearTimeout(
      toastTimer
    );

  }


  toastTimer =
    setTimeout(
      function() {

        toast.classList.remove(

        );

    );

/* =====================================================
   EXPORT LAYOUT TO IMAGE
===================================================== */

function bindExportImage() {

  const button =
    document.getElementById('exportImageBtn');

  if (!button) {
    return;
  }

  button.addEventListener(
    'click',
    exportLayoutImage
  );

}


async function exportLayoutImage() {
  const map = document.querySelector('.factory-map');
  const button = document.getElementById('exportImageBtn');
  if (!map) { showToast('Không tìm thấy sơ đồ'); return; }
  if (typeof html2canvas === 'undefined') {
    alert('Không tải được thư viện xuất ảnh. Vui lòng kiểm tra Internet.');
    return;
  }
  if (button.disabled) return;
  button.disabled = true;
  const originalButtonText = button.textContent;
  button.textContent = '⏳ Đang xuất 4 ảnh...';

  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp = now.getFullYear() + pad(now.getMonth() + 1) +
    pad(now.getDate()) + '-' + pad(now.getHours()) + pad(now.getMinutes());
  const dateLabel = 'Ngày ' + pad(now.getDate()) + '/' +
    pad(now.getMonth() + 1) + '/' + now.getFullYear() +
    ' - ' + pad(now.getHours()) + ':' + pad(now.getMinutes());

  const actions = [...map.querySelectorAll('.layout-actions')];
  const oldDisplays = actions.map(el => el.style.display);
  const oldSelected = [...map.querySelectorAll('.selected, .drag-source, .drag-target')]
    .map(el => ({el, selected: el.classList.contains('selected'),
      source: el.classList.contains('drag-source'), target: el.classList.contains('drag-target')}));
  let exportTitle = null;
  const root = document.documentElement;
  const previousZoom = root.style.zoom;

  const waitPaint = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const capture = async element => html2canvas(element, {
    backgroundColor: '#ffffff', scale: 2, useCORS: true, logging: false,
    width: element.scrollWidth, height: element.scrollHeight,
    windowWidth: Math.max(element.scrollWidth + 80, 1400),
    windowHeight: Math.max(element.scrollHeight, 768),
    onclone: clonedDoc => {
      // Không thay đổi giao diện đang xem.
      clonedDoc.querySelectorAll('.layout-actions').forEach(el => el.style.display = 'none');
    }
  });
  const savePng = canvas => new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (!blob) return reject(new Error('Không thể tạo ảnh PNG'));
      resolve(blob);
    }, 'image/png');
  });
  const downloadBlob = (blob, filename) => {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  };

  try {
    // Quan trọng: vô hiệu hóa zoom Android và CSS Mobile trước khi đo/capture.
    root.style.zoom = '1';
    document.body.classList.add('export-desktop-capture');
    document.body.classList.add('export-force-map');
    map.classList.add('exporting');
    actions.forEach(el => el.style.display = 'none');
    oldSelected.forEach(({el}) => el.classList.remove('selected', 'drag-source', 'drag-target'));

    // Ảnh tổng: giữ cách căn tiêu đề cũ theo mép phải Layout 3.
    exportTitle = document.createElement('div');
    exportTitle.className = 'export-map-title';
    exportTitle.innerHTML = '<div class="export-main-title">SƠ ĐỒ XE ĐỂ FOAM</div>' +
      '<div class="export-date">' + dateLabel + '</div>';
    map.appendChild(exportTitle);
    await waitPaint();
    const layout3 = map.querySelector('.layout-block.layout3');
    if (layout3) {
      const mapRect = map.getBoundingClientRect();
      const layoutRect = layout3.getBoundingClientRect();
      const right = layoutRect.right - mapRect.left;
      exportTitle.style.left = right + 'px';
      exportTitle.style.right = '0';
      exportTitle.style.width = (mapRect.width - right) + 'px';
      const firstSlot = layout3.querySelector('.slot');
      if (firstSlot) {
        const slotRect = firstSlot.getBoundingClientRect();
        exportTitle.style.top = (slotRect.top - mapRect.top + slotRect.height / 2 - 50) + 'px';
      }
    }
    await waitPaint();
    showToast('Đang tạo ảnh tổng...');
    const totalBlob = await savePng(await capture(map));
    downloadBlob(totalBlob, 'Tat_ca_Layout_' + stamp + '.png');
    exportTitle.remove();
    exportTitle = null;

    // Ảnh riêng: dựng bản sao ngoài màn hình, không thay đổi layout thực tế.
    for (let i = 1; i <= 3; i++) {
      showToast('Đang tạo ảnh Layout ' + i + ' (' + (i + 1) + '/4)...');
      const source = map.querySelector('.layout-block.layout' + i);
      if (!source) throw new Error('Không tìm thấy Layout ' + i);
      const holder = document.createElement('div');
      holder.style.cssText = 'position:absolute;left:0;top:0;background:#fff;' +
        'padding:24px;z-index:1;overflow:visible;pointer-events:none;';
      const heading = document.createElement('div');
      heading.style.cssText = 'text-align:center;font-family:Arial,sans-serif;color:#222;' +
        'margin:0 0 18px;font-weight:bold;font-size:23px;';
      heading.textContent = 'SƠ ĐỒ XE ĐỂ FOAM - LAYOUT ' + i;
      const date = document.createElement('div');
      date.style.cssText = 'text-align:center;font-family:Arial,sans-serif;' +
        'font-size:15px;color:#555;margin-bottom:22px;';
      date.textContent = dateLabel;
      const clone = source.cloneNode(true);
      clone.style.cssText = 'width:' + source.getBoundingClientRect().width +
        'px;min-width:0;margin:0;display:block;justify-self:auto;align-self:auto;';
      clone.querySelectorAll('.layout-actions').forEach(el => el.remove());
      holder.style.width = (Math.ceil(source.getBoundingClientRect().width) + 48) + 'px';
      holder.append(heading, date, clone);
      document.body.appendChild(holder);
      try {
        await waitPaint();
        const blob = await savePng(await capture(holder));
        downloadBlob(blob, 'Layout_' + i + '_' + stamp + '.png');
      } finally {
        holder.remove();
      }
    }
    showToast('Đã tạo 4 ảnh PNG');
  } catch (error) {
    console.error(error);
    alert('Không thể xuất đủ 4 ảnh: ' + (error.message || error));
  } finally {
    if (exportTitle) exportTitle.remove();
    actions.forEach((el, i) => el.style.display = oldDisplays[i]);
    oldSelected.forEach(({el, selected, source, target}) => {
      if (selected) el.classList.add('selected');
      if (source) el.classList.add('drag-source');
      if (target) el.classList.add('drag-target');
    });
    map.classList.remove('exporting');
    document.body.classList.remove('export-force-map');
    document.body.classList.remove('export-desktop-capture');
    root.style.zoom = previousZoom;
    button.disabled = false;
    button.textContent = originalButtonText;
  }
}

/* =====================================================
   ERROR
===================================================== */

function showError(
  error
) {

  const message =
    error &&
    error.message

      ? error.message

      : String(error);


  alert(
    'Lỗi: ' +
    message
  );

}
